<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET Detect - ล็อกอินสมาชิก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #4a5568;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .rfid-display {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-family: monospace;
            font-size: 1.2em;
            color: #4a5568;
            margin-bottom: 20px;
        }
        .member-info {
            background: #edf2f7;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .member-info h6 {
            color: #4a5568;
            margin-bottom: 5px;
        }
        .member-info p {
            margin-bottom: 5px;
            color: #2d3748;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>ล็อกอินสมาชิก</h1>
            <p class="text-muted">กรอกรหัสผ่านเพื่อเข้าสู่ระบบ</p>
        </div>

        <div class="rfid-display" id="rfidDisplay">
            RFID ID: <span id="rfidValue"></span>
        </div>

        <div class="member-info" id="memberInfo" style="display: none;">
            <h6>ข้อมูลสมาชิก:</h6>
            <p><strong>Username:</strong> <span id="memberUsername"></span></p>
            <p><strong>ชื่อ-นามสกุล:</strong> <span id="memberFullName"></span></p>
            <p><strong>อีเมล:</strong> <span id="memberEmail"></span></p>
        </div>

        <form id="loginForm">
            <input type="hidden" id="rfid_id" name="rfid_id">
            
            <div class="mb-3">
                <label for="password" class="form-label">รหัสผ่าน</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">
                ล็อกอิน
            </button>
        </form>

        <div class="back-link">
            <a href="/register/rfid">← กลับไปล็อก RFID</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ดึง RFID ID จาก URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const rfidId = urlParams.get('rfid_id');
        
        if (rfidId) {
            document.getElementById('rfid_id').value = rfidId;
            document.getElementById('rfidValue').textContent = rfidId;
        } else {
            alert('ไม่พบ RFID ID');
            window.location.href = '/register/rfid';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/register/login', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // แสดงข้อมูลสมาชิก
                    document.getElementById('memberUsername').textContent = result.member.username;
                    document.getElementById('memberFullName').textContent = result.member.full_name;
                    document.getElementById('memberEmail').textContent = result.member.email;
                    document.getElementById('memberInfo').style.display = 'block';
                    
                    alert('เข้าสู่ระบบสำเร็จ!');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
            }
        });
    </script>
</body>
</html>
