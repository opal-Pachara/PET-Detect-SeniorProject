<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - PET Detect</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #4a5568;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .rfid-input {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }
        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }
        .alert-info {
            background: #bee3f8;
            color: #2a4365;
            border: 1px solid #90cdf4;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .manual-input {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>เข้าสู่ระบบ PET Detect</h1>
            <p>ใส่ RFID ID เพื่อเข้าสู่ระบบ</p>
        </div>
        
        <div id="alert-container"></div>
        
        <div class="rfid-input">
            <h3>ใส่ RFID ID</h3>
            <p>ใส่ RFID ID ของคุณเพื่อเข้าสู่ระบบ</p>
            <div class="form-group">
                <input type="text" id="rfid_input" placeholder="ใส่ RFID ID" 
                       style="font-size: 18px; text-align: center; font-family: monospace;">
            </div>
            <button type="button" class="btn" onclick="loginWithRFID()">
                เข้าสู่ระบบ
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>กำลังตรวจสอบข้อมูล...</p>
        </div>
        
    </div>
    
    <script>
        function loginWithRFID() {
            const rfid = document.getElementById('rfid_input').value.trim();
            if (!rfid) {
                showAlert('กรุณาใส่ RFID ID', 'error');
                return;
            }
            processLogin(rfid);
        }
        
        function processLogin(rfid) {
            showLoading(true);
            
            fetch('/api/check_member', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ rfid_id: rfid })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                
                if (data.success) {
                    if (data.is_member) {
                        if (data.has_password) {
                            // เป็นสมาชิกและมี password แล้ว - ไปหน้าเข้าสู่ระบบ
                            showAlert('พบสมาชิกแล้ว กำลังไปหน้าเข้าสู่ระบบ...', 'info');
                            setTimeout(() => {
                                window.location.href = '/member_login?rfid=' + rfid;
                            }, 1500);
                        } else {
                            // เป็นสมาชิกแต่ยังไม่มี password - ไปหน้าสมัคร
                            showAlert('พบสมาชิกแต่ยังไม่มีรหัสผ่าน กำลังไปหน้าสมัคร...', 'info');
                            setTimeout(() => {
                                window.location.href = '/register?rfid=' + rfid;
                            }, 1500);
                        }
                    } else {
                        // ยังไม่เป็นสมาชิก - ไปหน้าสมัคร
                        showAlert('ยังไม่เป็นสมาชิก กำลังไปหน้าสมัคร...', 'info');
                        setTimeout(() => {
                            window.location.href = '/register?rfid=' + rfid;
                        }, 1500);
                    }
                } else {
                    showAlert('เกิดข้อผิดพลาด: ' + data.message, 'error');
                }
            })
            .catch(error => {
                showLoading(false);
                showAlert('เกิดข้อผิดพลาด: ' + error.message, 'error');
            });
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertClass = 'alert-' + type;
            
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }
        
        // Auto focus on RFID input
        document.getElementById('rfid_input').focus();
        
        // Enter key to login
        document.getElementById('rfid_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginWithRFID();
            }
        });
    </script>
</body>
</html>
